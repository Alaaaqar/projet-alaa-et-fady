<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CINETECH | Smart Backoffice</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="flex h-screen overflow-hidden">

    <aside class="w-72 bg-[#0a0a0f] border-r border-white/5 flex flex-col p-8">
        <div class="text-3xl font-extrabold text-[#7c66ff] italic tracking-tighter mb-12 uppercase">CINETECH</div>
        <nav class="space-y-3 flex-1">
            <button onclick="showSection('dashboard')" id="btn-dashboard" class="nav-link nav-active w-full flex items-center gap-4 p-4 rounded-2xl transition-all font-bold text-sm">
                <i class="fas fa-chart-line w-5"></i> Dashboard
            </button>
            <button onclick="showSection('films')" id="btn-films" class="nav-link w-full flex items-center gap-4 p-4 rounded-2xl transition-all font-bold text-sm text-gray-400">
                <i class="fas fa-film w-5"></i> Catalogue Films
            </button>
        </nav>
        <div class="mt-auto pt-6 border-t border-white/5 text-[10px] text-gray-600 font-bold uppercase tracking-widest text-center">
            EMSI • ALAA & FADY • 2025
        </div>
    </aside>

    <div class="flex-1 flex flex-col min-w-0">
        <header class="h-24 border-b border-white/5 px-10 flex justify-between items-center glass">
            <div>
                <p class="text-[10px] text-gray-500 font-black uppercase tracking-[0.3em]">System Status</p>
                <h2 id="page-title" class="text-xl font-bold uppercase italic">Dashboard</h2>
            </div>
            <div class="flex items-center gap-6">
                <div class="text-right">
                    <p class="text-[10px] text-[#7c66ff] font-black uppercase">Administrator</p>
                    <p class="text-sm font-bold">ALAA & FADY</p>
                </div>
                <div class="w-12 h-12 bg-gradient-to-tr from-[#7c66ff] to-[#b0a3ff] rounded-2xl flex items-center justify-center font-black shadow-lg">AF</div>
            </div>
        </header>

        <main class="flex-1 p-10 overflow-y-auto custom-scroll">
            
            <section id="dashboard" class="spa-section space-y-10">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div class="glass p-10 rounded-[40px] card-hover">
                        <p class="text-gray-500 text-xs font-bold uppercase mb-2">Films Enregistrés</p>
                        <h4 id="kpi-total" class="text-7xl font-black italic tracking-tighter">0</h4>
                    </div>
                    <div class="glass p-10 rounded-[40px] card-hover">
                        <p class="text-gray-500 text-xs font-bold uppercase mb-2">Réalisateurs</p>
                        <h4 id="kpi-reals" class="text-7xl font-black italic tracking-tighter">0</h4>
                    </div>
                </div>
                <div class="glass p-10 rounded-[40px] h-[450px]">
                    <h3 class="text-gray-400 text-xs font-bold uppercase mb-10 text-center tracking-widest">Répartition par Genre (%)</h3>
                    <canvas id="movieChart"></canvas>
                </div>
            </section>

            <section id="films" class="spa-section hidden space-y-10">
                <div class="glass p-10 rounded-[40px] flex flex-col lg:flex-row gap-10">
                    <div class="flex-1 relative">
                        <h3 id="form-mode" class="text-2xl font-black italic uppercase mb-8">Ajout Intelligent <span class="text-[#7c66ff]">.</span></h3>
                        <form id="movie-form" class="grid grid-cols-1 md:grid-cols-2 gap-5">
                            <input type="hidden" id="edit-id">
                            <div class="relative col-span-2">
                                <input type="text" id="m-title" oninput="fetchSuggestions()" placeholder="Titre du film (ex: Inception)..." class="w-full bg-[#0a0a0f] border border-white/10 p-5 rounded-2xl text-sm outline-none input-focus transition-all" autocomplete="off" required>
                                <div id="suggestions" class="absolute left-0 right-0 top-full mt-3 bg-[#121217] border border-[#7c66ff]/40 rounded-2xl hidden z-50 shadow-2xl max-h-64 overflow-y-auto custom-scroll"></div>
                            </div>
                            <input type="number" id="m-year" placeholder="Année" class="bg-[#0a0a0f] border border-white/10 p-5 rounded-2xl text-sm outline-none input-focus" required>
                            <select id="m-genre" class="bg-[#0a0a0f] border border-white/10 p-5 rounded-2xl text-sm outline-none input-focus">
                                <option value="Action">Action</option>
                                <option value="Drame">Drame</option>
                                <option value="SF">SF</option>
                                <option value="Horreur">Horreur</option>
                                <option value="Animation">Animation</option>
                            </select>
                            <button type="submit" id="btn-submit" class="col-span-2 bg-[#7c66ff] hover:bg-[#5e49e0] py-5 rounded-2xl font-black uppercase text-xs tracking-widest transition-all">Enregistrer le film</button>
                            <button type="button" id="btn-cancel" onclick="resetForm()" class="hidden col-span-2 text-gray-500 font-bold text-[10px] uppercase text-center">Annuler la modification</button>
                        </form>
                    </div>
                    <div id="m-preview" class="w-full lg:w-56 h-80 bg-[#0a0a0f] rounded-[30px] border border-white/5 flex items-center justify-center overflow-hidden">
                        <i class="fas fa-image text-white/5 text-6xl"></i>
                    </div>
                </div>

                <div class="flex flex-col md:flex-row gap-5">
                    <div class="relative flex-1">
                        <i class="fas fa-search absolute left-6 top-1/2 -translate-y-1/2 text-gray-600"></i>
                        <input type="text" id="search-input" oninput="renderMovies()" placeholder="Rechercher dans la collection..." class="w-full bg-white/5 border border-white/5 p-5 pl-14 rounded-full text-sm outline-none focus:border-[#7c66ff]/50">
                    </div>
                    <select id="sort-select" onchange="renderMovies()" class="bg-white/5 border border-white/5 px-10 rounded-full text-[10px] font-bold uppercase outline-none">
                        <option value="az">Titre (A-Z)</option>
                        <option value="newest">Plus récents</option>
                        <option value="oldest">Plus anciens</option>
                    </select>
                </div>

                <div id="movie-grid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-8"></div>

                <div class="pt-20 border-t border-white/5">
                    <h3 class="text-2xl font-black italic uppercase mb-10">Gestion des Réalisateurs</h3>
                    <div class="flex gap-4 mb-10">
                        <input type="text" id="r-name" placeholder="Nom du réalisateur..." class="flex-1 bg-white/5 border border-white/5 p-5 rounded-2xl outline-none focus:border-[#7c66ff]/50">
                        <button onclick="addReal()" class="bg-white text-black px-12 rounded-2xl font-black uppercase text-xs hover:bg-gray-200 transition-colors">Ajouter</button>
                    </div>
                    <div id="real-list" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
                </div>
            </section>
        </main>
    </div>

    <div id="modal" class="fixed inset-0 bg-[#050508]/90 hidden z-[2000] flex items-center justify-center p-8 backdrop-blur-xl" onclick="closeModal()">
        <div class="bg-[#121217] max-w-5xl w-full rounded-[50px] flex flex-col md:flex-row overflow-hidden border border-white/10 shadow-2xl" onclick="event.stopPropagation()">
            <img id="modal-img" class="w-full md:w-[400px] object-cover h-[600px]" src="">
            <div class="p-16 flex-1 flex flex-col justify-center">
                <span id="modal-genre" class="text-[#7c66ff] font-black text-xs uppercase tracking-[0.4em] mb-4"></span>
                <h2 id="modal-title" class="text-6xl font-black italic mb-6 leading-tight"></h2>
                <p id="modal-year" class="text-gray-500 text-xl mb-8 font-bold"></p>
                <div class="h-px w-20 bg-[#7c66ff] mb-8"></div>
                <p id="modal-desc" class="text-gray-400 leading-loose text-lg"></p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
